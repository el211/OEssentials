tab:
  enabled: true
  use-placeholderapi: true
  interval-ticks: 2
  layout-mode: CUSTOM

  network:
    all-servers: true
    excluded-servers:
      - hub

  two-column-layout:
    enabled: true

    dynamic-columns: true
    min-columns: 1
    max-columns: 3
    columns: 2

    border: '<#0A4C47>◀<gradient:#2BD89F:#DCF6E4>━━━━━━━━━━━━━━━━━━━</gradient><#2BD89F>◆</#2BD89F><gradient:#DCF6E4:#2BD89F>━━━━━━━━━━━━━━━━━━━</gradient><#0A4C47>▶'

    header-title-texts:
      - '<gradient:#DCF6E4:#2BD89F><bold>◆ OEssentials ◆</bold></gradient>'
      - '<gradient:#B1DECB:#017E6B><bold>◆ OEssentials ◆</bold></gradient>'
      - '<#2BD89F><bold>◆ OEssentials ◆</bold></#2BD89F>'
      - '<gradient:#017E6B:#DCF6E4><bold>◆ OEssentials ◆</bold></gradient>'

    footer: '<#0A4C47>◀<gradient:#2BD89F:#DCF6E4>━━━━━━━━━━━━━━━━━━━</gradient><#2BD89F>◆</#2BD89F><gradient:#DCF6E4:#2BD89F>━━━━━━━━━━━━━━━━━━━</gradient><#0A4C47>▶'

    top-left:
      texts:
        - |-
          <center><gray>En ligne: <#2BD89F>%oe_network_online%</#2BD89F> <gray>joueur(s)</gray></center>
          <dark_gray>──────────────</dark_gray>
        - |-
          <center><gray>En ligne: <gradient:#2BD89F:#DCF6E4>%oe_network_online%</gradient> <gray>joueur(s)</gray></center>
          <dark_gray>──────────────</dark_gray>
        - |-
          <center><gray>En ligne: <#B1DECB>%oe_network_online%</#B1DECB> <gray>joueur(s)</gray></center>
          <dark_gray>──────────────</dark_gray>
        - |-
          <center><gray>En ligne: <gradient:#017E6B:#2BD89F>%oe_network_online%</gradient> <gray>joueur(s)</gray></center>
          <dark_gray>──────────────</dark_gray>

    top-right:
      texts:
        - |-
          <center><gray>Ping: <#2BD89F>%player_ping%</#2BD89F> <gray>ms</gray></center>
          <dark_gray>──────────────</dark_gray>
        - |-
          <center><gray>Ping: <gradient:#2BD89F:#DCF6E4>%player_ping%</gradient> <gray>ms</gray></center>
          <dark_gray>──────────────</dark_gray>
        - |-
          <center><gray>Ping: <#B1DECB>%player_ping%</#B1DECB> <gray>ms</gray></center>
          <dark_gray>──────────────</dark_gray>
        - |-
          <center><gray>Ping: <gradient:#017E6B:#2BD89F>%player_ping%</gradient> <gray>ms</gray></center>
          <dark_gray>──────────────</dark_gray>

    bottom-left:
      texts:
        - |-
          <dark_gray>──────────────</dark_gray>
          <center><gray>News <#2BD89F>◆</#2BD89F> <gray>Support</gray> <#2BD89F>◆</#2BD89F> <gray>Shop</gray></center>
        - |-
          <dark_gray>──────────────</dark_gray>
          <center><gradient:#2BD89F:#DCF6E4>News ◆ Support ◆ Shop</gradient></center>
        - |-
          <dark_gray>──────────────</dark_gray>
          <center><#B1DECB>News ◆ Support ◆ Shop</#B1DECB></center>
        - |-
          <dark_gray>──────────────</dark_gray>
          <center><gradient:#017E6B:#2BD89F>News ◆ Support ◆ Shop</gradient></center>

    bottom-right:
      texts:
        - |-
          <dark_gray>──────────────</dark_gray>
          <center><#2BD89F>oreostudios.fr</#2BD899F></center>
        - |-
          <dark_gray>──────────────</dark_gray>
          <center><gradient:#2BD89F:#DCF6E4>oreostudios.fr</gradient></center>
        - |-
          <dark_gray>──────────────</dark_gray>
          <center><#B1DECB>oreostudios.fr</#B1DECB></center>
        - |-
          <dark_gray>──────────────</dark_gray>
          <center><gradient:#017E6B:#2BD89F>oreostudios.fr</gradient></center>

  custom-layout:
    enabled: true
    change-interval: 30

    top-section:
      texts:
        - |-
          <#0A4C47>◀<gradient:#2BD89F:#DCF6E4>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#2BD89F>◆</#2BD89F><gradient:#DCF6E4:#2BD89F>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#0A4C47>▶
          <center><gradient:#DCF6E4:#2BD89F><bold>◆ OEssentials ◆</bold></gradient> <dark_gray>·</dark_gray> <gray>%oe_network_online% joueurs en ligne</gray></center>
          <center><dark_gray>──────────────────────────────────────────</dark_gray></center>

        - |-
          <#0A4C47>◀<gradient:#017E6B:#2BD89F>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#B1DECB>◆</#B1DECB><gradient:#2BD89F:#017E6B>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#0A4C47>▶
          <center><gradient:#B1DECB:#017E6B><bold>◆ OEssentials ◆</bold></gradient> <dark_gray>·</dark_gray> <gray>%oe_network_online% joueurs en ligne</gray></center>
          <center><dark_gray>──────────────────────────────────────────</dark_gray></center>

        - |-
          <#0A4C47>◀<gradient:#2BD89F:#B1DECB>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#DCF6E4>◆</#DCF6E4><gradient:#B1DECB:#2BD89F>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#0A4C47>▶
          <center><#2BD89F><bold>◆ OEssentials ◆</bold></#2BD89F> <dark_gray>·</dark_gray> <gray>%oe_network_online% joueurs en ligne</gray></center>
          <center><dark_gray>──────────────────────────────────────────</dark_gray></center>

        - |-
          <#0A4C47>◀<gradient:#DCF6E4:#017E6B>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#2BD89F>◆</#2BD89F><gradient:#017E6B:#DCF6E4>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#0A4C47>▶
          <center><gradient:#017E6B:#DCF6E4><bold>◆ OEssentials ◆</bold></gradient> <dark_gray>·</dark_gray> <gray>%oe_network_online% joueurs en ligne</gray></center>
          <center><dark_gray>──────────────────────────────────────────</dark_gray></center>

    player-section:
      enabled: true

      player-format:
        format: '<center>%luckperms_prefix%%player_color%%player_name%%afk_indicator%</center>'

        rank-colors:
          owner:      '<gradient:#FF4500:#FF8C00>'
          fondateur:  '<gradient:#FF4500:#FF8C00>'
          admin:      '<#FF5555>'
          moderateur: '<#5599FF>'
          helper:     '<#77CCFF>'
          staff:      '<#AAAAFF>'
          vip_plus:   '<gradient:#FFD700:#FF8C00>'
          vip:        '<#FFD700>'
          default:    '<#DCF6E4>'

        show-afk: true
        afk-format: ' <dark_gray>[AFK]</dark_gray>'
        show-ping-bars: true

    bottom-section:
      texts:
        - |-
          <center><dark_gray>──────────────────────────────────────────</dark_gray></center>
          <center><gray>News  <#2BD89F>◆</#2BD89F>  <gray>Support</gray>  <#2BD89F>◆</#2BD89F>  <gray>Shop</gray></center>
          <center><#2BD89F>oreostudios.fr</#2BD89F></center>
          <#0A4C47>◀<gradient:#2BD89F:#DCF6E4>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#2BD89F>◆</#2BD89F><gradient:#DCF6E4:#2BD89F>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#0A4C47>▶

        - |-
          <center><dark_gray>──────────────────────────────────────────</dark_gray></center>
          <center><gray>News  <#2BD89F>◆</#2BD89F>  <gray>Support</gray>  <#2BD89F>◆</#2BD89F>  <gray>Shop</gray></center>
          <center><gradient:#2BD89F:#DCF6E4>oreostudios.fr</gradient></center>
          <#0A4C47>◀<gradient:#017E6B:#2BD89F>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#B1DECB>◆</#B1DECB><gradient:#2BD89F:#017E6B>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#0A4C47>▶

        - |-
          <center><dark_gray>──────────────────────────────────────────</dark_gray></center>
          <center><gray>News  <#B1DECB>◆</#B1DECB>  <gray>Support</gray>  <#B1DECB>◆</#B1DECB>  <gray>Shop</gray></center>
          <center><#B1DECB>oreostudios.fr</#B1DECB></center>
          <#0A4C47>◀<gradient:#2BD89F:#B1DECB>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#DCF6E4>◆</#DCF6E4><gradient:#B1DECB:#2BD89F>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#0A4C47>▶

        - |-
          <center><dark_gray>──────────────────────────────────────────</dark_gray></center>
          <center><gray>News  <#2BD89F>◆</#2BD89F>  <gray>Support</gray>  <#2BD89F>◆</#2BD89F>  <gray>Shop</gray></center>
          <center><gradient:#017E6B:#DCF6E4>oreostudios.fr</gradient></center>
          <#0A4C47>◀<gradient:#DCF6E4:#017E6B>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#2BD89F>◆</#2BD89F><gradient:#017E6B:#DCF6E4>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</gradient><#0A4C47>▶

    sorting:
      method: RANK

      rank-priority:
        owner: 100
        fondateur: 100
        admin: 90
        moderateur: 80
        helper: 70
        staff: 60
        vip_plus: 50
        vip: 40
        default: 10

  title:
    enabled: false

  name-format:
    enabled: true
    use-rank-formats: false
    rank-key: '%luckperms_primary_group%'

    server-tag: ' <#0A4C47>(<gray><italic>%server_name%</italic></gray>)</#0A4C47>'

    pattern: '%luckperms_prefix%%simplenick_nickname%%oe_server_tag%'

    rank-formats:
      default: '<#2BD89F>%mcmmo_power_level%</#2BD89F> <dark_gray>•</dark_gray> <gray>|</gray> %luckperms_prefix% <#DCF6E4>%nick_or_name%</#DCF6E4>'

    enforce-max-length: false
    max-length: 64
    overflow: TRIM